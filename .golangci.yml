---
version: "2"
linters:
  default: all
  disable:
    - depguard
    # we don't use json with camel-case
    - tagliatelle
    - nolintlint
    # it should improve to support more known patterns
    - varnamelen
    - ireturn
    - revive
    - wrapcheck
    - noinlineerr
    # deprecated, replaced by their new major versions (exhaustruct_v5, gomodguard_v2, wsl_v5)
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    exhaustruct_v5:
      ignore-patterns:
        # cobra commands are built with only a handful of their many optional fields
        - '.+/cobra\.Command$'
